<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0D12">
<title>Erre</title>
<meta name="description" content="Tus fechas, tu plata.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fuentes locales (OFL): andan sin conexión, con fallback a la del sistema */
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 500 800; font-display: swap; src: url(fonts/manrope-latin.woff2) format("woff2"); }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/unbounded-600-latin.woff2) format("woff2"); }

/* =========================================================
   ERRE · hoja de estilos de la app
   Mismas clases e IDs que usa el JavaScript actual.
   En la app real: los tokens van en :root y las fuentes se
   sirven desde /fonts (cacheadas por el service worker).
   ========================================================= */

/* ---------- Tokens · tema oscuro (principal) ---------- */
:root {
  /* superficies */
  --bg: #0E0D12;
  --surface: #18171E;
  --surface-2: #211F29;
  --surface-3: #2B2935;
  --surface-paid: #131217;
  --line: #2C2A35;
  --line-strong: #403D4C;

  /* texto */
  --text: #F4F2F8;
  --muted: #A6A3B3;
  --dim: #8A8796;

  /* marca */
  --accent: #C9B3FF;          /* lila Erre: acciones y montos destacados */
  --accent-ink: #17122B;      /* texto sobre lila */
  --accent-text: #C9B3FF;     /* lila usado como texto/enlace */
  --accent-soft: rgba(201,179,255,.14);
  --echo-1: #8A75D6;          /* eco del isotipo / serie "Gané" */
  --echo-2: #4E4380;

  /* estados (siempre con ícono + etiqueta) */
  --paid: #5EE08A;
  --paid-soft: rgba(94,224,138,.13);
  --paid-bar: #2FAF63;
  --pend: #F2B45A;
  --pend-soft: rgba(242,180,90,.15);
  --danger: #FF8F8F;
  --danger-soft: rgba(255,143,143,.12);

  /* piezas especiales */
  --hero-bg: #C9B3FF;
  --hero-ink: #17122B;
  --hero-muted: #3E3466;
  --hero-e1: #5B3FD0;
  --hero-e2: #8A75D6;
  --nav-bg: rgba(30,27,38,.52);
  --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.02) 55%);
  --glass-warm: radial-gradient(120% 140% at 15% 0%, rgba(255,186,140,.16), transparent 55%), radial-gradient(120% 140% at 90% 0%, rgba(201,179,255,.16), transparent 60%);
  --glass-edge: rgba(255,255,255,.13);
  --glass-hi: rgba(255,255,255,.16);
  --glass-shadow: 0 18px 40px -12px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.18);
  --tab-on-bg: linear-gradient(180deg, #FFF8F1 0%, #F1E9FF 100%);
  --tab-on-ink: #17122B;
  --tab-on-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 6px 18px -4px rgba(255,190,150,.35), 0 2px 6px rgba(0,0,0,.18);
  --toast-bg: #F4F2F8;
  --toast-ink: #17122B;
  --toast-action: #5B3FD0;
  --scrim: rgba(6,5,9,.68);
  --focus: #C9B3FF;

  /* tipografía (con fallback a la del sistema) */
  --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Unbounded", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 17px;
  --fs-xl: 20px; --fs-2xl: 24px; --fs-amount: 30px; --fs-hero: 44px;

  /* espaciado (base 4) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* radios */
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px; --r-pill: 999px;

  /* sombras */
  --shadow-1: 0 1px 0 rgba(255,255,255,.035) inset, 0 8px 22px rgba(0,0,0,.32);
  --shadow-float: 0 14px 36px rgba(0,0,0,.55);

  /* táctil */
  --tap: 48px;
  color-scheme: dark;
}

/* ---------- Tokens · variante clara ---------- */
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F3F1F7;
    --surface: #FFFFFF;
    --surface-2: #F1EEF7;
    --surface-3: #E6E2EF;
    --surface-paid: #F8F7FA;
    --line: #E3DFEA;
    --line-strong: #CBC6D8;
    --text: #16141C;
    --muted: #5C596A;
    --dim: #6B6779;
    --accent: #5B3FD0;
    --accent-ink: #FFFFFF;
    --accent-text: #5B3FD0;
    --accent-soft: rgba(91,63,208,.1);
    --echo-1: #8A75D6;
    --echo-2: #C9B3FF;
    --paid: #137A3E;
    --paid-soft: rgba(19,122,62,.1);
    --paid-bar: #1F9D55;
    --pend: #995700;
    --pend-soft: rgba(242,180,90,.24);
    --danger: #B42828;
    --danger-soft: rgba(180,40,40,.08);
    --hero-bg: #17141F;
    --hero-ink: #F4F2F8;
    --hero-muted: #B9B4C9;
    --nav-bg: rgba(255,255,255,.58);
    --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.25) 60%);
    --glass-warm: radial-gradient(120% 140% at 15% 0%, rgba(255,196,160,.28), transparent 55%), radial-gradient(120% 140% at 90% 0%, rgba(201,179,255,.30), transparent 60%);
    --glass-edge: rgba(255,255,255,.85);
    --glass-hi: rgba(255,255,255,1);
    --glass-shadow: 0 0 0 1px rgba(40,30,70,.06), 0 18px 40px -14px rgba(70,50,110,.30), 0 2px 8px rgba(70,50,110,.08);
    --tab-on-bg: linear-gradient(180deg, #2B2338 0%, #17141F 100%);
    --tab-on-ink: #FFF6EE;
    --tab-on-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 8px 18px -6px rgba(91,63,208,.45);
    --toast-bg: #17141F;
    --toast-ink: #F4F2F8;
    --toast-action: #C9B3FF;
    --scrim: rgba(22,20,28,.45);
    --focus: #5B3FD0;
    --shadow-1: 0 1px 2px rgba(22,20,28,.06), 0 6px 18px rgba(22,20,28,.06);
    --shadow-float: 0 12px 30px rgba(22,20,28,.16);
    color-scheme: light;
    --hero-e1: #8A75D6;
    --hero-e2: #4E4380;
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
body { font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
svg { flex: none; }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; line-height: 1.2; margin: 4px 0 18px; }
.top h1 { margin: 0; }
.top .mark { width: 34px; height: 34px; }

/* ---------- Resumen "Me deben" ---------- */
.hero { position: relative; overflow: hidden; background: var(--hero-bg); color: var(--hero-ink); border-radius: var(--r-xl); padding: 20px 22px 20px; margin-bottom: 24px; }
.hero .lbl { color: var(--hero-muted); font-size: var(--fs-sm); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.hero .big { font-size: var(--fs-hero); font-weight: 800; letter-spacing: -.025em; line-height: 1.05; margin-top: 6px; }
.hero .sub { font-size: var(--fs-md); font-weight: 600; margin-top: 8px; color: var(--hero-ink); }
.hero .sub b { font-weight: 800; }
.hero .echo { position: absolute; right: -22px; top: -16px; width: 150px; height: 150px; color: var(--hero-muted); opacity: .16; pointer-events: none; }

/* ---------- Tarjeta ticket ---------- */
.ev { position: relative; overflow: hidden; background: var(--surface); border-radius: var(--r-lg); margin-bottom: 14px; box-shadow: var(--shadow-1); }
.ev-top { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 16px 18px 14px; min-height: var(--tap); }
.ev-date { flex: none; width: 54px; text-align: center; padding-right: 14px; border-right: 1px solid var(--line); }
.ev-date .w { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--muted); }
.ev-date .d { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.05; margin-top: 2px; }
.ev-date .m { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .14em; color: var(--accent-text); margin-top: 2px; }
.ev-info { min-width: 0; }
.ev-venue { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-name { font-size: 18px; font-weight: 800; line-height: 1.25; margin: 3px 0 4px; }
.ev-meta { font-size: var(--fs-sm); color: var(--muted); }

/* troquel: línea punteada + muescas */
.ev-cut { position: relative; height: 2px; margin: 0 18px; background-image: linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 12px); background-size: 12px 2px; }
.ev-cut::before, .ev-cut::after { content: ""; position: absolute; top: -9px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
.ev-cut::before { left: -28px; }
.ev-cut::after { right: -28px; }

.ev-bot { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 10px 12px; padding: 14px 18px 18px; }
.ev-status { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ev-money .lbl { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.amt { font-size: var(--fs-amount); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin-top: 2px; }
.brk { font-size: var(--fs-sm); color: var(--muted); line-height: 1.4; margin-top: 4px; }
.ev-bot > .brk { grid-column: 1 / -1; margin-top: -2px; }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px 0 9px; border-radius: var(--r-pill); font-size: var(--fs-sm); font-weight: 800; }
.badge svg { width: 15px; height: 15px; }
.badge.pend { background: var(--pend-soft); color: var(--pend); }
.badge.paid { background: var(--paid-soft); color: var(--paid); }

.pct { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px 0 12px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); color: var(--muted); font-size: var(--fs-sm); font-weight: 800; }
.pct::after { content: ""; position: absolute; inset: -8px -4px; }
.pct svg { width: 13px; height: 13px; }
.pct.on { color: var(--text); }

/* pagada: se apaga, conserva legibilidad */
.ev.is-paid { background: var(--surface-paid); box-shadow: none; border: 1px solid var(--line); }
.ev.is-paid .amt { color: var(--muted); }
.ev.is-paid .ev-name { color: var(--muted); }
.ev.is-paid .ev-date .m { color: var(--muted); }

/* ---------- Botones ---------- */
.btn-pay { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 20px; border-radius: var(--r-pill); background: var(--accent); color: var(--accent-ink); font-size: var(--fs-md); font-weight: 800; white-space: nowrap; }
.btn-pay svg { width: 18px; height: 18px; }
.btn-undo { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); color: var(--text); font-size: 14px; font-weight: 700; white-space: nowrap; }
.btn-undo svg { width: 16px; height: 16px; }
.btn-line { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--line-strong); font-size: 14px; font-weight: 700; white-space: nowrap; }
.btn-line svg { width: 17px; height: 17px; }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

/* ---------- Estados vacíos ---------- */
.empty { text-align: center; padding: 40px 20px 24px; color: var(--muted); }
.empty .art { width: 96px; height: 96px; margin: 0 auto 18px; display: block; }
.empty b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--text); margin-bottom: 8px; line-height: 1.25; }
.empty p { margin: 0 auto 22px; max-width: 280px; font-size: var(--fs-md); line-height: 1.5; }

/* ---------- Eventos: buscador, chips, grupos ---------- */
.search-wrap { position: relative; display: block; margin-bottom: 12px; }
.search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search { width: 100%; min-height: var(--tap); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 0 16px 0 46px; font-size: var(--fs-md); }
.search::placeholder { color: var(--dim); }
.search:focus { outline: 2px solid var(--focus); border-color: transparent; }
.chips { display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; }
.chip { min-height: 44px; padding: 0 18px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); color: var(--muted); font-size: 14px; font-weight: 700; white-space: nowrap; }
.chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.group { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; justify-content: space-between; align-items: baseline; padding: 18px 4px 10px; font-size: var(--fs-sm); font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.group span { letter-spacing: 0; text-transform: none; font-weight: 700; }

/* ---------- FAB ---------- */
.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 5; width: 60px; height: 60px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow-float); }
.fab svg { width: 28px; height: 28px; }
.fab { transition: transform .2s ease; }
body:has(.toast.show) .fab, .phone:has(.toast.show) .fab { transform: translateY(-68px); }

/* ---------- Barra de pestañas flotante ---------- */
nav.tabs { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 6; max-width: 536px; margin: 0 auto; display: flex; gap: 6px; padding: 8px; background: var(--glass-warm), var(--glass-sheen), var(--nav-bg); border: 1px solid var(--glass-edge); border-radius: 30px; box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
nav.tabs button { flex: 1; min-width: 0; min-height: 58px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 11.5px; font-weight: 700; transition: background .25s ease, color .25s ease, transform .12s ease; }
nav.tabs button:active { transform: scale(.96); }
nav.tabs button.on { background: var(--tab-on-bg); color: var(--tab-on-ink); box-shadow: var(--tab-on-shadow); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { nav.tabs { background-color: var(--surface); } }
@media (prefers-reduced-motion: reduce) { nav.tabs button { transition: none; } nav.tabs button:active { transform: none; } }
nav.tabs svg { width: 22px; height: 22px; }

/* ---------- Toast / snackbar ---------- */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 30; max-width: 528px; margin: 0 auto; display: none; align-items: center; gap: 12px; min-height: 56px; padding: 6px 6px 6px 16px; border-radius: 16px; background: var(--toast-bg); color: var(--toast-ink); box-shadow: var(--shadow-float); font-size: var(--fs-md); font-weight: 700; }
.toast.show { display: flex; }
.toast span { flex: 1; min-width: 0; }
.toast button { min-height: 44px; padding: 0 14px; border-radius: 12px; color: var(--toast-action); font-weight: 800; }

/* ---------- Rendimiento ---------- */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.month-nav button { width: var(--tap); height: var(--tap); border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; }
.month-nav button svg { width: 22px; height: 22px; }
.month-nav .t { font-family: var(--font-display); font-size: 18px; font-weight: 600; text-transform: capitalize; }
.sum { background: var(--surface); border-radius: var(--r-xl); padding: 20px; box-shadow: var(--shadow-1); }
.sum .lbl { font-size: var(--fs-sm); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sum .big { font-size: 40px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; margin: 6px 0 16px; }
.meter { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; }
.meter i { display: block; height: 100%; }
.meter .m-paid { background: var(--paid-bar); border-radius: 7px 3px 3px 7px; }
.meter .m-pend { border-radius: 3px 7px 7px 3px; background: repeating-linear-gradient(135deg, var(--pend) 0 5px, color-mix(in srgb, var(--pend) 55%, var(--surface)) 5px 9px); }
.meter-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.meter-legend .k { display: flex; align-items: center; gap: 7px; font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
.meter-legend .k svg { width: 15px; height: 15px; }
.meter-legend .k.paid svg { color: var(--paid); }
.meter-legend .k.pend svg { color: var(--pend); }
.meter-legend .v { font-size: 20px; font-weight: 800; margin-top: 3px; }
.meter-legend .s { font-size: var(--fs-xs); color: var(--muted); margin-top: 1px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.tile { background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px; }
.tile .k { font-size: var(--fs-sm); color: var(--muted); font-weight: 600; line-height: 1.3; }
.tile .v { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -.01em; }
.tile .v.g { color: var(--paid); } .tile .v.a { color: var(--pend); } .tile .v.p { color: var(--accent-text); }
.tile.wide { grid-column: 1 / -1; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); background: var(--surface); border-radius: var(--r-lg); margin-top: 12px; }
.stats3 > div { padding: 14px 12px; text-align: center; }
.stats3 > div + div { border-left: 1px solid var(--line); }
.stats3 .v { font-size: 22px; font-weight: 800; }
.stats3 .k { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; margin-top: 2px; }

.card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; margin-top: 12px; }
.card h3 { margin: 0 0 4px; font-size: var(--fs-md); font-weight: 800; }
.card .hint { color: var(--muted); font-size: var(--fs-sm); line-height: 1.45; margin-bottom: 14px; }
.legend { display: flex; gap: 16px; font-size: var(--fs-sm); color: var(--muted); font-weight: 700; margin-bottom: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 22px; border-bottom: 1px solid var(--line); }
.bcol { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
.bpair { flex: 1; display: flex; align-items: flex-end; gap: 2px; width: 100%; justify-content: center; position: relative; }
.bar { width: 42%; max-width: 16px; border-radius: 4px 4px 0 0; min-height: 2px; }
.bar.gen { background: var(--echo-1); } .bar.cob { background: var(--paid-bar); }
.bval { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; color: var(--text); white-space: nowrap; }
.bmonths { display: flex; gap: 8px; margin-top: 8px; }
.bmonths span { flex: 1; text-align: center; font-size: var(--fs-xs); color: var(--muted); font-weight: 700; text-transform: capitalize; }
.bmonths span.cur { color: var(--text); font-weight: 800; }
.list-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-md); }
.list-row:last-child { border-bottom: 0; padding-bottom: 0; }
.list-row span { color: var(--muted); }

/* ---------- Ajustes ---------- */
.set-title { font-size: var(--fs-sm); font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 6px 4px 10px; }
.set { background: var(--surface); border-radius: var(--r-lg); padding: 2px 16px; margin-bottom: 22px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-md); font-weight: 700; }
.set-row:last-child { border-bottom: 0; }
.set-row .s { color: var(--muted); font-size: var(--fs-sm); font-weight: 500; margin-top: 3px; line-height: 1.35; }
.inp-fix { display: flex; align-items: center; width: 118px; min-height: var(--tap); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); padding: 0 12px; gap: 4px; flex: none; }
.inp-fix span { color: var(--muted); font-weight: 700; }
.inp-fix input { width: 100%; min-width: 0; border: 0; background: none; text-align: right; font-weight: 800; font-size: 17px; padding: 0; }
.inp-fix input:focus { outline: none; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.inp-fix:focus-within { outline: 2px solid var(--focus); border-color: transparent; }
.formula { font-size: var(--fs-sm); color: var(--muted); line-height: 1.45; padding: 12px 0 14px; border-top: 1px solid var(--line); }
.formula b { color: var(--text); }
.foot { color: var(--muted); font-size: var(--fs-sm); line-height: 1.55; margin: 0 4px; }
.about { display: flex; align-items: center; gap: 10px; margin: 22px 4px 0; color: var(--muted); font-size: var(--fs-sm); }
.about svg { width: 28px; height: 28px; }

/* ---------- Hoja inferior / formulario ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: none; align-items: flex-end; justify-content: center; }
.sheet-bg.open { display: flex; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom)); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 14px; }
.sheet h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 4px 0 18px; }
.f { margin-bottom: 14px; }
.f label { display: block; color: var(--muted); font-size: var(--fs-sm); font-weight: 700; margin-bottom: 7px; }
.f input, .f textarea { width: 100%; min-height: var(--tap); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 0 14px; font-size: 16px; font-weight: 600; }
.f textarea { padding: 12px 14px; }
.f input:focus, .f textarea:focus { outline: 2px solid var(--focus); border-color: transparent; }
.f .money { font-weight: 800; font-size: 17px; }
.adorn { position: relative; display: block; }
.adorn span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; pointer-events: none; }
.adorn input { padding-left: 30px; }
.adorn.suf span { left: auto; right: 14px; }
.adorn.suf input { padding-left: 14px; padding-right: 34px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preview { position: relative; border: 1.5px solid var(--accent); background: var(--accent-soft); border-radius: var(--r-lg); padding: 14px 16px; margin: 4px 0 16px; color: var(--muted); font-size: var(--fs-sm); }
.preview .lbl { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-text); }
.preview b { display: block; color: var(--text); font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: 4px 0 8px; }
.preview .ln { display: flex; justify-content: space-between; gap: 8px; padding-top: 4px; }
.preview .ln strong { color: var(--text); font-weight: 700; }
.check { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; background: var(--surface-2); border-radius: var(--r-md); margin-bottom: 14px; font-weight: 700; }
.check input { width: 22px; height: 22px; accent-color: var(--paid-bar); }
.actions { display: flex; gap: 10px; margin-top: 8px; }
.actions .btn-pay { flex: 1; }

/* ---------- Isotipo en línea (se adapta al tema) ---------- */
.iso { --iso-k: var(--bg); --iso-m: var(--text); --iso-e1: var(--echo-1); --iso-e2: var(--echo-2); }
.hero .iso { --iso-k: var(--hero-bg); --iso-m: var(--hero-ink); --iso-e1: var(--hero-e1); --iso-e2: var(--hero-e2); }
.iso .k { fill: var(--iso-k); stroke: var(--iso-k); stroke-width: 10; stroke-linejoin: round; }
.iso .m { fill: var(--iso-m); } .iso .e1 { fill: var(--iso-e1); } .iso .e2 { fill: var(--iso-e2); }
.search-x { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); }
.search-x svg { position: static; transform: none; width: 18px; height: 18px; }
.search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
</style>
</head>
<body>
<main class="wrap" id="view"></main>
<button class="fab" id="fab" aria-label="Cargar evento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="Secciones">
  <button data-tab="mis" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M9 7v1.5M9 11.25v1.5M9 15.5V17"/></svg><span>Mis Eventos</span></button>
  <button data-tab="eventos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Eventos</span></button>
  <button data-tab="rend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg><span>Rendimiento</span></button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Ajustes</span></button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn"></button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY = 'rrpp.v1';
const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];

const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  checkB:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  noRes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width:36px;height:36px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8.5 8.5l5 5M13.5 8.5l-5 5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};
// Isotipo de Erre: R + dos ecos. Los colores salen del tema (ver .iso en el CSS).
function iso(cls){
  const R='M23 23H58A24 24 0 0 1 58 71H37V92H23Z M37 37V57H58A10 10 0 0 0 58 37Z M50 66H66L90 92H74Z';
  const E='M37 23H58A24 24 0 0 1 58 71H37Z M37 37V57H58A10 10 0 0 0 58 37Z M50 66H66L90 92H74Z';
  const S='M23 23H58A24 24 0 0 1 58 71H37V92H23Z M50 66H66L90 92H74Z', SE='M37 23H58A24 24 0 0 1 58 71H37Z M50 66H66L90 92H74Z';
  return `<svg class="iso ${cls||''}" viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(-8.5 2.5)"><path class="e2" transform="translate(24 0)" d="${E}"/><path class="k" transform="translate(12 0)" d="${SE}"/><path class="e1" transform="translate(12 0)" d="${E}"/><path class="k" d="${S}"/><path class="m" d="${R}"/></g></svg>`;
}

let db = load();
let tab = 'mis';
let filtro = 'todos';
let busqueda = '';
let mesSel = ymOf(hoy());

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.events)) return Object.assign({settings:{freeValue:1000,pct:8}}, d);
  }catch(e){}
  return {events:[], settings:{freeValue:1000, pct:8}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('No se pudo guardar en el teléfono. Exportá un backup desde Ajustes.'); }
}
function hoy(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function ymOf(s){ return s.slice(0,7); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const fmt = new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
function $m(n){ return '$ '+fmt.format(Math.round(n||0)); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n=parseFloat(String(v).replace(/\./g,'').replace(',','.')); return isFinite(n)?n:0; }

function calc(e){
  const comision = (e.facturado||0)*(e.pct||0)/100;
  const frees = (e.frees||0)*(e.freeValue||0);
  return {comision, frees, total: comision+frees};
}
function fechaCorta(s){ const [y,m,d]=s.split('-'); return `${d}/${m}`; }
function diaSemana(s){ const [y,m,d]=s.split('-').map(Number); return DIAS[new Date(y,m-1,d).getDay()]; }

/* ---------- Tarjeta ticket ---------- */
function card(e){
  const c = calc(e);
  const [,m,d] = e.date.split('-');
  const pct = fmt.format(e.pct||0);
  return `<article class="ev ${e.paid?'is-paid':''}">
    <button class="ev-top" data-edit="${e.id}">
      <div class="ev-date"><div class="w">${diaSemana(e.date)}</div><div class="d">${d}</div><div class="m">${MESES[+m-1]}</div></div>
      <div class="ev-info">
        <div class="ev-venue">${esc(e.venue)||'Sin lugar'}</div>
        <div class="ev-name">${esc(e.name)||'Sin nombre'}</div>
        <div class="ev-meta">${fmt.format(e.tickets||0)} entradas · ${$m(e.facturado)} facturado</div>
      </div>
    </button>
    <div class="ev-cut"></div>
    <div class="ev-bot">
      <div class="ev-status">
        ${e.paid
          ? `<span class="badge paid">${I.checkB}Pagado ${e.paidAt?fechaCorta(e.paidAt):''}</span>`
          : `<span class="badge pend">${I.clock}Pendiente</span>`}
        <button class="pct ${e.pct>0?'on':''}" data-pct="${e.id}" aria-label="Cambiar comisión, ${pct}%">${pct}%${I.pen}</button>
      </div>
      <div class="ev-money">
        <div class="lbl">${e.paid?'Cobrado':'A cobrar'}</div>
        <div class="amt">${$m(c.total)}</div>
      </div>
      ${e.paid
        ? `<button class="btn-undo" data-unpay="${e.id}">${I.undo}Deshacer</button>`
        : `<button class="btn-pay" data-pay="${e.id}">${I.check}Marcar pagado</button>`}
      <div class="brk">${$m(c.comision)} comisión + ${fmt.format(e.frees||0)} free · ${$m(c.frees)}</div>
    </div>
  </article>`;
}
const byDateDesc = (a,b)=> b.date.localeCompare(a.date);

/* ---------- Pantallas ---------- */
function vMis(){
  const pend = db.events.filter(e=>!e.paid).sort(byDateDesc);
  const total = pend.reduce((s,e)=>s+calc(e).total,0);
  let h = `<header class="top"><h1>Mis Eventos</h1>${iso('mark')}</header>
    <section class="hero">${iso('echo')}
      <div class="lbl">Me deben en total</div>
      <div class="big">${$m(total)}</div>
      <div class="sub">${pend.length ? `<b>${pend.length}</b> ${pend.length===1?'fecha pendiente':'fechas pendientes'} de pago` : 'Nada pendiente por ahora'}</div></section>`;
  if(!pend.length){
    h += db.events.length
      ? `<div class="empty">${iso('art')}<b>Todo cobrado</b><p>Nadie te debe nada. Las fechas pagadas están en Eventos.</p></div>`
      : `<div class="empty">${iso('art')}<b>Tu primera fecha te espera</b><p>Cargá el evento que trabajaste y Erre te calcula la comisión al toque.</p>
          <button class="btn-pay" data-new="1">${I.plus}Cargar mi primera fecha</button>
          <p style="margin:22px auto 0;font-size:13px">¿Venís de otro teléfono? Importá tu backup desde Ajustes.</p></div>`;
  } else h += pend.map(card).join('');
  return h;
}

function vEventos(){
  let list = db.events.slice().sort(byDateDesc);
  if(filtro==='pend') list = list.filter(e=>!e.paid);
  if(filtro==='pag') list = list.filter(e=>e.paid);
  const q = busqueda.trim().toLowerCase();
  if(q) list = list.filter(e=>(e.name+' '+e.venue).toLowerCase().includes(q));
  let h = `<h1>Eventos</h1>
    <label class="search-wrap">${I.search}<input class="search" id="search" type="search" enterkeyhint="search" autocomplete="off" placeholder="Buscar por nombre o lugar" aria-label="Buscar por nombre o lugar" value="${esc(busqueda)}">${busqueda?`<button class="search-x" data-clear="1" aria-label="Borrar búsqueda">${I.x}</button>`:''}</label>
    <div class="chips">
      ${[['todos','Todos'],['pend','Pendientes'],['pag','Pagados']].map(([k,l])=>`<button class="chip ${filtro===k?'on':''}" data-filtro="${k}">${l}</button>`).join('')}
    </div>`;
  if(!list.length){
    if(q) return h + `<div class="empty" style="padding-top:56px"><div style="width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin:0 auto 20px;color:var(--muted)">${I.noRes}</div><b>Nada con “${esc(busqueda.trim())}”</b><p>Probá con otro nombre o lugar. Si es una fecha nueva, cargala con el +.</p><button class="btn-line" data-clear="1">Limpiar búsqueda</button></div>`;
    return h + `<div class="empty"><b>No hay fechas</b><p>${db.events.length?'Probá con otro filtro.':'Tocá + para cargar la primera.'}</p></div>`;
  }
  let cur='', grupos=[];
  for(const e of list){ const ym=ymOf(e.date); if(ym!==cur){ cur=ym; grupos.push({ym, items:[]}); } grupos[grupos.length-1].items.push(e); }
  for(const g of grupos){
    const [y,m]=g.ym.split('-');
    h += `<div class="group">${MESES_L[+m-1]} ${y}<span>${g.items.length} ${g.items.length===1?'fecha':'fechas'}</span></div>` + g.items.map(card).join('');
  }
  return h;
}

function shiftYm(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${String(m).padStart(2,'0')}`; }
function statsMes(ym){
  const ev = db.events.filter(e=>ymOf(e.date)===ym);
  const generado = ev.reduce((s,e)=>s+calc(e).total,0);
  const cobrado = db.events.filter(e=>e.paid && e.paidAt && ymOf(e.paidAt)===ym).reduce((s,e)=>s+calc(e).total,0);
  const pendiente = ev.filter(e=>!e.paid).reduce((s,e)=>s+calc(e).total,0);
  return {ev, generado, cobrado, pendiente,
    entradas: ev.reduce((s,e)=>s+(e.tickets||0),0),
    frees: ev.reduce((s,e)=>s+(e.frees||0),0),
    facturado: ev.reduce((s,e)=>s+(e.facturado||0),0),
    comision: ev.reduce((s,e)=>s+calc(e).comision,0),
    freesM: ev.reduce((s,e)=>s+calc(e).frees,0)};
}
function milCorto(n){ return n>=1e6 ? '$ '+(n/1e6).toFixed(1).replace('.',',')+' M' : '$ '+fmt.format(Math.round(n/1000))+' mil'; }
function vRend(){
  const s = statsMes(mesSel);
  const [y,m] = mesSel.split('-');
  const deudaTotal = db.events.filter(e=>!e.paid).reduce((a,e)=>a+calc(e).total,0);
  const meses = [5,4,3,2,1,0].map(i=>shiftYm(mesSel,-i));
  const data = meses.map(ym=>({ym, ...statsMes(ym)}));
  const max = Math.max(1,...data.map(d=>Math.max(d.generado,d.cobrado)));
  const lugares = {};
  s.ev.forEach(e=>{ const k=e.venue||'Sin lugar'; lugares[k]=(lugares[k]||0)+calc(e).total; });
  const top = Object.entries(lugares).sort((a,b)=>b[1]-a[1]);
  const cob = s.generado - s.pendiente;                      // de lo ganado este mes, lo ya cobrado
  const pp = s.generado ? Math.round(cob/s.generado*100) : 0;
  const meter = !s.generado ? `<i style="flex:1;background:var(--surface-3);border-radius:7px"></i>`
    : (cob?`<i class="m-paid" style="width:${pp}%"></i>`:'') + (s.pendiente?`<i class="m-pend" style="flex:1"></i>`:'');
  return `<h1>Rendimiento</h1>
    <div class="month-nav"><button data-mes="-1" aria-label="Mes anterior">${I.left}</button>
      <div class="t">${MESES_L[+m-1]} ${y}</div>
      <button data-mes="1" aria-label="Mes siguiente">${I.right}</button></div>
    <section class="sum">
      <div class="lbl">Ganaste en ${MESES_L[+m-1]}</div>
      <div class="big">${$m(s.generado)}</div>
      <div class="meter" role="img" aria-label="De lo ganado: ${pp}% cobrado, ${s.generado?100-pp:0}% pendiente">${meter}</div>
      <div class="meter-legend">
        <div><div class="k paid">${I.checkB}Cobrado</div><div class="v">${$m(cob)}</div><div class="s">${pp}% de lo ganado</div></div>
        <div><div class="k pend">${I.clock}Pendiente</div><div class="v">${$m(s.pendiente)}</div><div class="s">${s.generado?100-pp:0}% de lo ganado</div></div>
      </div>
    </section>
    <div class="grid">
      <div class="tile"><div class="k">Me pagaron en el mes</div><div class="v g">${$m(s.cobrado)}</div><div class="k" style="font-size:12px;margin-top:4px">Incluye pagos de fechas anteriores</div></div>
      <div class="tile"><div class="k">Me deben en total</div><div class="v a">${$m(deudaTotal)}</div><div class="k" style="font-size:12px;margin-top:4px">Sumando todos los meses</div></div>
    </div>
    <div class="stats3">
      <div><div class="v">${s.ev.length}</div><div class="k">Fechas</div></div>
      <div><div class="v">${fmt.format(s.entradas)}</div><div class="k">Entradas</div></div>
      <div><div class="v">${fmt.format(s.frees)}</div><div class="k">Free</div></div>
    </div>
    <div class="card"><h3>Últimos 6 meses</h3>
      <div class="hint">“Gané” cuenta por fecha del evento; “Me pagaron”, por fecha de pago.</div>
      <div class="legend"><span><i style="background:var(--echo-1)"></i>Gané</span><span><i style="background:var(--paid-bar)"></i>Me pagaron</span></div>
      <div class="bars" role="img" aria-label="Gané y me pagaron por mes">${data.map(d=>`<div class="bcol"><div class="bpair" title="${MESES_L[+d.ym.slice(5)-1]}: gané ${$m(d.generado)}, me pagaron ${$m(d.cobrado)}">
        ${d.ym===mesSel&&d.generado?`<div class="bval">${milCorto(d.generado)}</div>`:''}
        <div class="bar gen" style="height:${d.generado/max*100}%"></div><div class="bar cob" style="height:${d.cobrado/max*100}%"></div></div></div>`).join('')}</div>
      <div class="bmonths">${data.map(d=>`<span class="${d.ym===mesSel?'cur':''}">${MESES_L[+d.ym.slice(5)-1].slice(0,3)}</span>`).join('')}</div>
    </div>
    <div class="card"><h3>Detalle del mes</h3>
      <div class="list-row"><span>Total facturado (entradas)</span><b>${$m(s.facturado)}</b></div>
      <div class="list-row"><span>Por comisión</span><b>${$m(s.comision)}</b></div>
      <div class="list-row"><span>Por free</span><b>${$m(s.freesM)}</b></div>
    </div>
    ${top.length?`<div class="card"><h3>Por lugar</h3>${top.map(([k,v])=>`<div class="list-row"><span>${esc(k)}</span><b>${$m(v)}</b></div>`).join('')}</div>`:''}`;
}

function vAjustes(){
  return `<h1>Ajustes</h1>
    <div class="set-title">Cómo se calcula</div>
    <div class="set">
      <div class="set-row"><div><label for="sPct">Comisión por defecto</label><div class="s">% del total facturado</div></div>
        <span class="inp-fix"><input type="number" inputmode="decimal" id="sPct" value="${db.settings.pct}"><span>%</span></span></div>
      <div class="set-row"><div><label for="sFree">Valor por free</label><div class="s">Se suma por cada free que des</div></div>
        <span class="inp-fix"><span>$</span><input type="number" inputmode="numeric" id="sFree" value="${db.settings.freeValue}"></span></div>
      <div class="formula">A cobrar = <b>${fmt.format(db.settings.pct)}%</b> del facturado + <b>${$m(db.settings.freeValue)}</b> por free. Se aplica a las fechas nuevas; las que ya cargaste no cambian.</div>
    </div>
    <div class="set-title">Tus datos</div>
    <div class="set">
      <div class="set-row"><div>Exportar backup<div class="s">Bajá un archivo con todas tus fechas</div></div>
        <button class="btn-line" id="exp">${I.down}Exportar</button></div>
      <div class="set-row"><div>Importar backup<div class="s">Pasá tus fechas desde otro teléfono</div></div>
        <button class="btn-line" id="imp">${I.up}Importar</button></div>
      <div class="set-row"><div>Borrar todo<div class="s">Elimina las fechas de este teléfono</div></div>
        <button class="btn-line btn-danger" id="wipe">${I.trash}Borrar</button></div>
    </div>
    <p class="foot">Tus datos se guardan solo en este teléfono. Hacé un backup de vez en cuando por si cambiás de celu. ${db.events.length} ${db.events.length===1?'fecha cargada':'fechas cargadas'}.</p>
    <div class="about">${iso()}<span><b style="color:var(--text)">Erre</b> · Tus fechas, tu plata.</span></div>`;
}

function render(){
  const v = {mis:vMis, eventos:vEventos, rend:vRend, ajustes:vAjustes}[tab]();
  document.getElementById('view').innerHTML = v;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  document.getElementById('fab').style.display = (tab==='mis'||tab==='eventos')?'':'none';
  const s = document.getElementById('search');
  if(s) s.oninput = ()=>{ busqueda=s.value; const pos=s.selectionStart; render(); const n=document.getElementById('search'); n.focus(); n.setSelectionRange(pos,pos); };
  if(tab==='ajustes') bindAjustes();
}

/* ---------- Formulario (hoja inferior) ---------- */
function moneyIn(id, name, val){ return `<input id="${id}" name="${name}" inputmode="numeric" autocomplete="off" class="money" data-money="1" value="${val?fmt.format(val):''}" placeholder="0">`; }
function openForm(id){
  const e = id ? db.events.find(x=>x.id===id) : {
    date: hoy(), venue: lastVenue(), name:'', tickets:0, facturado:0, frees:0,
    freeValue: db.settings.freeValue, pct: db.settings.pct, paid:false, paidAt:null, notes:''};
  const sh = document.getElementById('sheet');
  sh.innerHTML = `<div class="grab" aria-hidden="true"></div><h2>${id?'Editar fecha':'Nueva fecha'}</h2>
    <form id="evForm">
      <div class="f"><label for="fName">Evento / artista</label><input id="fName" name="name" value="${esc(e.name)}" placeholder="Nombre del evento" autocomplete="off"></div>
      <div class="two">
        <div class="f"><label for="fDate">Fecha</label><input id="fDate" type="date" name="date" required value="${e.date}"></div>
        <div class="f"><label for="fVenue">Lugar</label><input id="fVenue" name="venue" list="venues" value="${esc(e.venue)}" placeholder="Boliche o predio" autocomplete="off"></div>
      </div>
      <datalist id="venues">${[...new Set(db.events.map(x=>x.venue).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
      <div class="two">
        <div class="f"><label for="fTickets">Entradas vendidas</label><input id="fTickets" inputmode="numeric" name="tickets" class="money" value="${e.tickets||''}" placeholder="0" autocomplete="off"></div>
        <div class="f"><label for="fFact">Total facturado</label><span class="adorn"><span>$</span>${moneyIn('fFact','facturado',e.facturado)}</span></div>
      </div>
      <div class="two">
        <div class="f"><label for="fFrees">Free que diste</label><input id="fFrees" inputmode="numeric" name="frees" class="money" value="${e.frees||''}" placeholder="0" autocomplete="off"></div>
        <div class="f"><label for="fFreeV">Valor por free</label><span class="adorn"><span>$</span>${moneyIn('fFreeV','freeValue',e.freeValue)}</span></div>
      </div>
      <div class="f"><label for="fPct">Comisión</label><span class="adorn suf"><span>%</span><input id="fPct" inputmode="decimal" name="pct" class="money" value="${e.pct}" autocomplete="off"></span></div>
      <div class="preview" id="prev" aria-live="polite"></div>
      <label class="check"><input type="checkbox" name="paid" ${e.paid?'checked':''}> Ya me la pagaron</label>
      <div class="f" id="paidAtWrap" style="${e.paid?'':'display:none'}"><label for="fPaidAt">Fecha de pago</label><input id="fPaidAt" type="date" name="paidAt" value="${e.paidAt||hoy()}"></div>
      <div class="f"><label for="fNotes">Notas</label><textarea id="fNotes" name="notes" rows="2" placeholder="Ej.: me paga el lunes por transferencia">${esc(e.notes)}</textarea></div>
      <div class="actions">
        ${id?'<button type="button" class="btn-line btn-danger" id="del">Eliminar</button>':''}
        <button type="button" class="btn-line" id="cancel">Cancelar</button>
        <button type="submit" class="btn-pay">Guardar fecha</button>
      </div>
    </form>`;
  const f = document.getElementById('evForm');
  const read = ()=>({date:f.date.value, venue:f.venue.value.trim(), name:f.name.value.trim(),
    tickets:num(f.tickets.value), facturado:num(f.facturado.value), frees:num(f.frees.value),
    freeValue:num(f.freeValue.value), pct:num(f.pct.value), paid:f.paid.checked,
    paidAt:f.paid.checked?(f.paidAt.value||hoy()):null, notes:f.notes.value.trim()});
  const upd = ()=>{ const r=read(), c=calc(r); document.getElementById('prev').innerHTML=`<div class="lbl">A cobrar · se calcula mientras escribís</div><b>${$m(c.total)}</b>
    <div class="ln"><span>${fmt.format(r.pct||0)}% de ${$m(r.facturado)}</span><strong>${$m(c.comision)}</strong></div>
    <div class="ln"><span>${fmt.format(r.frees||0)} free × ${$m(r.freeValue)}</span><strong>${$m(c.frees)}</strong></div>`; };
  // Montos con punto de miles mientras escribís (num() ya entiende los puntos)
  f.querySelectorAll('[data-money]').forEach(inp=>inp.addEventListener('input',()=>{
    const pos = inp.selectionStart, before = inp.value.slice(0,pos).replace(/\D/g,'').length;
    const digits = inp.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
    inp.value = digits ? fmt.format(+digits) : '';
    let i=0, seen=0; while(i<inp.value.length && seen<before){ if(/\d/.test(inp.value[i])) seen++; i++; }
    inp.setSelectionRange(i,i);
  }));
  f.oninput = upd; upd();
  f.paid.onchange = ()=>{ document.getElementById('paidAtWrap').style.display=f.paid.checked?'':'none'; };
  f.onsubmit = ev=>{
    ev.preventDefault();
    const data = read();
    if(id) Object.assign(e, data); else db.events.push({id:uid(), ...data});
    save(); closeSheet(); render(); toast(id?'Fecha actualizada':'Fecha agregada');
  };
  document.getElementById('cancel').onclick = closeSheet;
  const del = document.getElementById('del');
  if(del) del.onclick = ()=>{
    const idx = db.events.findIndex(x=>x.id===id); const copy = db.events[idx];
    db.events.splice(idx,1); save(); closeSheet(); render();
    toast('Fecha eliminada','Deshacer',()=>{ db.events.push(copy); save(); render(); });
  };
  document.getElementById('sheetBg').classList.add('open');
}
function lastVenue(){ const l=db.events.slice().sort(byDateDesc)[0]; return l?l.venue:''; }
function closeSheet(){ document.getElementById('sheetBg').classList.remove('open'); }

function openPct(id){
  const e = db.events.find(x=>x.id===id);
  const sh = document.getElementById('sheet');
  sh.innerHTML = `<div class="grab" aria-hidden="true"></div><h2>Comisión de ${esc(e.name)||'esta fecha'}</h2>
    <form id="pctForm"><div class="f"><label for="pPct">Porcentaje del facturado</label>
    <span class="adorn suf"><span>%</span><input id="pPct" type="number" inputmode="decimal" min="0" step="0.5" name="pct" class="money" value="${e.pct}"></span></div>
    <div class="actions"><button type="button" class="btn-line" id="cancel">Cancelar</button><button class="btn-pay">Guardar</button></div></form>`;
  const f = document.getElementById('pctForm');
  f.onsubmit = ev=>{ ev.preventDefault(); e.pct=num(f.pct.value); save(); closeSheet(); render(); };
  document.getElementById('cancel').onclick = closeSheet;
  document.getElementById('sheetBg').classList.add('open');
  setTimeout(()=>f.pct.select(),50);
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg, btn, fn){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  const b=document.getElementById('toastBtn'); b.textContent=btn||''; b.style.display=btn?'':'none';
  b.onclick=()=>{ t.classList.remove('show'); fn&&fn(); };
  t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 4000);
}

/* ---------- Eventos de UI ---------- */
document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-tab],[data-edit],[data-pay],[data-unpay],[data-pct],[data-filtro],[data-mes],[data-new],[data-clear]');
  if(!t) return;
  const d = t.dataset;
  if(d.tab){ tab=d.tab; render(); scrollTo(0,0); }
  else if(d.edit) openForm(d.edit);
  else if(d.pct) openPct(d.pct);
  else if(d.pay){
    const e=db.events.find(x=>x.id===d.pay); e.paid=true; e.paidAt=hoy(); save(); render();
    toast(`${e.name||'Fecha'} pagada · ${$m(calc(e).total)}`,'Deshacer',()=>{ e.paid=false; e.paidAt=null; save(); render(); });
  }
  else if(d.unpay){
    const e=db.events.find(x=>x.id===d.unpay); const prev=e.paidAt; e.paid=false; e.paidAt=null; save(); render();
    toast('Vuelve a pendiente','Deshacer',()=>{ e.paid=true; e.paidAt=prev; save(); render(); });
  }
  else if(d.filtro){ filtro=d.filtro; render(); }
  else if(d.mes){ mesSel=shiftYm(mesSel, +d.mes); render(); }
  else if(d.new) openForm(null);
  else if(d.clear){ busqueda=''; render(); }
});
document.getElementById('fab').onclick = ()=>openForm(null);
document.getElementById('sheetBg').addEventListener('click', ev=>{ if(ev.target.id==='sheetBg') closeSheet(); });

function bindAjustes(){
  const sF=document.getElementById('sFree'), sP=document.getElementById('sPct');
  sF.onchange=()=>{ db.settings.freeValue=num(sF.value); save(); render(); toast('Guardado'); };
  sP.onchange=()=>{ db.settings.pct=num(sP.value); save(); render(); toast('Guardado'); };
  document.getElementById('exp').onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`erre-backup-${hoy()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  document.getElementById('imp').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('wipe').onclick=()=>{
    if(confirm('¿Borrar todas las fechas de este teléfono? Esto no se puede deshacer.')){ db.events=[]; save(); render(); }
  };
}
document.getElementById('importFile').onchange = async ev=>{
  const file=ev.target.files[0]; if(!file) return;
  try{
    const d=JSON.parse(await file.text());
    if(!Array.isArray(d.events)) throw 0;
    if(!confirm(`Restaurar ${d.events.length} fechas? Se reemplazan los datos actuales.`)) return;
    db={settings:Object.assign({freeValue:1000,pct:8},d.settings), events:d.events}; save(); render(); toast('Backup restaurado');
  }catch(e){ alert('El archivo no es un backup válido.'); }
  ev.target.value='';
};

render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
